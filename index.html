<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANANYA'S STORE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header onclick="go('home')"><h1>ANANYA'S STORE</h1></header>
<main><div id="view"></div></main>
<button id="cart" onclick="showCart()">cart (0 items)</button>
<div id="modal" onclick="if(event.target===this)closeCart()"><div class="sheet" id="sheet"></div></div>

<script src="products.js"></script>
<script>
// ===== ใส่ลิงก์โปรไฟล์ของร้านตรงนี้ (วางลิงก์ระหว่าง "") =====
// ช่องไหนยังว่าง ไอคอนจะขึ้นแต่กดแล้วยังไม่ไปไหน
const LINKS={
  LINE:"",       // เช่น https://line.me/ti/p/xxxx
  Instagram:"",  // เช่น https://instagram.com/ชื่อไอจี
  WhatsApp:"",   // เช่น https://wa.me/66812345678
  TikTok:""      // เช่น https://tiktok.com/@ชื่อติ๊กตอก
};
// โลโก้ร้าน: อัปโหลดรูปชื่อ logo.png ไว้ใน repo เดียวกัน จะขึ้นอัตโนมัติ

// ===== ข้อความหน้าข้อมูล (แก้ได้) =====
const info={
  read:{title:"Read Before Order",tag:"ul",items:["ใส่ข้อความอ่านก่อนสั่งซื้อตรงนี้","ไม่รับเปลี่ยน/คืนสินค้า ยกเว้นสินค้าชำรุด","กรุณาถ่ายวิดีโอตอนแกะพัสดุ"]},
  how:{title:"How to Order",tag:"ol",items:["เลือกหมวดและกด “เพิ่ม” ที่สินค้าที่ต้องการ","กดตะกร้ามุมขวาล่าง ตรวจรายการให้ถูกต้อง","แคปหน้าจอตะกร้าส่งให้ร้านทาง DM","ร้านจะแจ้งค่าส่งและเตรียมของให้"]},
  promo:{title:"Promotion",tag:"ul",items:["ใส่โปรโมชั่นของร้านตรงนี้"]}
};

const ICONS={
  LINE:'<svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M21 10.66C21 6.44 16.96 3 12 3S3 6.44 3 10.66c0 3.78 3.2 6.96 7.53 7.56 1.05.24.93.64.7 2.13-.04.24-.18.93.78.51.96-.42 5.18-3.2 7.07-5.48 1.3-1.5 1.93-3.05 1.93-4.72z"/><text x="12" y="12.6" text-anchor="middle" font-size="5.6" font-weight="800" font-family="Arial,sans-serif" fill="#fff" stroke="none">LINE</text></svg>',
  Instagram:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>',
  WhatsApp:'<svg viewBox="0 0 24 24"><path d="M3 21l1.65-4.9A9 9 0 1 1 8.1 19.4z"/><path transform="translate(6.5 6.5) scale(.45)" d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  TikTok:'<svg viewBox="0 0 24 24"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>'
};

// ตะกร้า: จำไว้ในเครื่องลูกค้า รีเฟรชแล้วไม่หาย
let cart={};
try{const s=JSON.parse(localStorage.getItem('ananya_cart')||'{}');
  for(const i in s)if(products[i]&&s[i]>0)cart[i]=s[i];}catch(e){}
function save(){try{localStorage.setItem('ananya_cart',JSON.stringify(cart))}catch(e){}}

const v=document.getElementById('view');
const btn=(t,f,c='big')=>`<button class="${c}" onclick="${f}">${t}</button>`;
const back=f=>`<button class="back" onclick="${f}">‹ Back</button>`;
let cur=['home'];

function go(page,arg,keep){
  cur=[page,arg];
  if(page==='home'){
    v.innerHTML=`<div class="logo"><span>A</span><img src="logo.png" alt="logo" onerror="this.remove()"></div>
    <div class="contacts">${Object.entries(LINKS).map(([n,u])=>`<a ${u?`href="${u}" target="_blank" rel="noopener"`:`href="#" onclick="return false"`} aria-label="${n}">${ICONS[n]}</a>`).join('')}</div>
    <div class="menu">${btn('Read Before Ordering',"go('read')")}${btn('How To Order',"go('how')")}${btn('Promotion',"go('promo')")}${btn('Shop here',"go('shop')",'big main')}</div>`;
  }else if(info[page]){
    const i=info[page];
    v.innerHTML=`${back("go('home')")}<h2>${i.title}</h2><div class="box"><${i.tag}>${i.items.map(x=>`<li>${x}</li>`).join('')}</${i.tag}></div>`;
  }else if(page==='shop'){
    v.innerHTML=`${back("go('home')")}<div class="menu">${cats.map((c,i)=>btn(c,`go('cat',${i})`)).join('')}</div>`;
  }else if(page==='cat'){
    const c=cats[arg];
    const list=products.map((p,i)=>({p,i})).filter(x=>x.p.cat===c);
    v.innerHTML=`${back("go('shop')")}<h2>${c}</h2><div class="grid">${list.map(({p,i})=>`<div class="card"><div class="ph">${p.img?`<img src="${p.img}" alt="${p.name}">`:'รูปสินค้า'}</div><b>${p.name}</b>${p.detail?`<div class="detail">${p.detail}</div>`:''}<div class="price">฿${p.price}</div>${p.soldOut?'<span class="sold">sold out</span>':`<div class="row"><button class="add" onclick="chg(${i},1)">add</button><button class="del" onclick="chg(${i},-1)">cancel</button></div><div class="qty" id="q${i}">${cart[i]?'ในตะกร้า '+cart[i]+' ชิ้น':''}</div>`}</div>`).join('')||'<p>ยังไม่มีสินค้าในหมวดนี้</p>'}</div>`;
  }
  if(!keep)scrollTo(0,0);
}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function refresh(){
  document.getElementById('cart').textContent=`Cart (${count()} Item)`;
  document.querySelectorAll('.qty').forEach(q=>{const i=q.id.slice(1);q.textContent=cart[i]?'Cart '+cart[i]+' Item':''});
  save();
}
function chg(i,d){
const n=Math.min(1,(cart[i]||0)+d);
  if(n<=0)delete cart[i];else cart[i]=n;
  refresh();
}
function cc(i,d){chg(i,d);showCart()}
function clearCart(){if(confirm('Cleqr cart')){cart={};refresh();showCart()}}
function showCart(){
  const ids=Object.keys(cart);
  let html='<h2>My cart</h2>';
  if(!ids.length)html+='<p>Your cart is empty</p>';
  else{
    let total=0;
    html+=ids.map(i=>{const p=products[i],q=cart[i];total+=p.price*q;
      return `<div class="line"><div><div>${p.name}</div><div class="ctl"><button class="rm" onclick="cc(${i},-99)">cancel</button></div>
</div><span>฿${p.price*q}</span></div>`}).join('');
    html+=`<div class="total"><span>Total</span><span>฿${total}</span></div>
    <p class="note">* ยอดนี้เป็นค่าสินค้าอย่างเดียว ยังไม่รวมค่าส่ง<br>แคปหน้าจอนี้ส่งให้ร้านทาง DM ได้เลย</p>
    <button class="clear" onclick="clearCart()">ล้างตะกร้าทั้งหมด</button>`;
  }
  html+=`<button class="big" style="width:100%;padding:14px" onclick="closeCart()">close</button>`;
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('modal').style.display='flex';
}
function closeCart(){document.getElementById('modal').style.display='none'}
refresh();
go('home');
</script>
</body>
</html>
