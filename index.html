<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANANYA'S STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ฟอนต์: ถ้าอยากเปลี่ยน ให้แก้ชื่อ Mali ตรงนี้ และในบรรทัด font-family ด้านล่าง -->
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#c9668c;--pink-soft:#f9e4ec;--pink-btn:#e8a6bf;--blue:#bcd6f0;--blue-text:#4a6a9c;--bg:#fff7f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#555;font-family:"Mali","Sukhumvit Set",sans-serif}
button{font-family:inherit}
header{background:var(--pink-soft);border-bottom:6px solid var(--blue);text-align:center;padding:36px 16px;cursor:pointer}
header h1{margin:0;color:var(--pink);font-size:2rem}
main{max-width:560px;margin:0 auto;padding:24px 16px 100px}
.dm{text-align:center;margin-bottom:20px}
.dm p{margin:0 0 10px}
.icons{display:flex;gap:12px;justify-content:center}
.icons a{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--pink);box-shadow:0 2px 8px #0001;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;text-decoration:none}
.menu{display:flex;flex-direction:column;gap:14px}
.big{border:0;border-radius:18px;padding:20px;font-size:1.1rem;font-family:inherit;background:var(--blue);color:var(--blue-text);cursor:pointer}
.big.main{background:var(--pink);color:#fff;font-weight:700}
.back{background:none;border:0;color:var(--pink);font-size:1rem;cursor:pointer;margin-bottom:12px;padding:0;font-family:inherit}
h2{color:var(--pink);margin:0 0 14px}
.box{background:#fff;border:2px solid var(--pink-soft);border-radius:18px;padding:18px;line-height:1.7}
.box ol,.box ul{margin:0;padding-left:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:2px solid var(--pink-soft);border-radius:18px;padding:12px;text-align:center}
.ph{background:var(--pink-soft);color:var(--pink);border-radius:12px;height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.card b{display:block;font-size:.95rem}
.price{color:var(--pink);font-weight:700;margin:4px 0 8px}
.add{background:var(--pink-btn);color:#fff;border:0;border-radius:999px;padding:6px 22px;cursor:pointer;font-family:inherit}
#cart{position:fixed;right:16px;bottom:16px;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-family:inherit;font-size:1rem;box-shadow:0 4px 14px #0003;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue-text);outline-offset:2px}
</style>
</head>
<body>
<header onclick="go('home')"><h1>ANANYA'S STORE</h1></header>
<main>
  <div class="dm">
    <p>DM here</p>
    <div class="icons" id="icons"></div>
  </div>
  <div id="view"></div>
</main>
<button id="cart" onclick="showCart()">ตะกร้า (0 ชิ้น)</button>

<script>
// ===== ใส่ลิงก์ช่องทางติดต่อตรงนี้ (วางลิงก์ระหว่างเครื่องหมาย "" ) =====
const LINKS={
  LINE:"",       // เช่น https://line.me/ti/p/xxxx
  IG:"",         // เช่น https://instagram.com/ชื่อไอจี
  WA:"",         // เช่น https://wa.me/66812345678
  TikTok:""      // เช่น https://tiktok.com/@ชื่อติ๊กตอก
};
// ถ้ายังไม่ใส่ลิงก์ ปุ่มนั้นจะซ่อนไว้ให้อัตโนมัติ
document.getElementById('icons').innerHTML=Object.entries(LINKS)
  .filter(([,u])=>u)
  .map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener" aria-label="${n}">${n==='TikTok'?'TT':n}</a>`).join('');
if(!document.getElementById('icons').innerHTML)document.querySelector('.dm').style.display='none';

// แก้ข้อมูลสินค้าตรงนี้
const products=[
  {name:"Pink Bow Clip",price:59,cat:"Accessories",isNew:true},
  {name:"Blue Ribbon Scrunchie",price:45,cat:"Accessories",isNew:false},
  {name:"Cherry Lip Tint",price:89,cat:"Beauty",isNew:true},
  {name:"Cream Cardigan",price:259,cat:"Clothing",isNew:false}
];
const cats=["New Arrivals","Accessories","Clothing","Beauty"];
// แก้ข้อความหน้าข้อมูลตรงนี้
const info={
  read:{title:"อ่านก่อนสั่งซื้อ",items:["สินค้าเป็นงานพร้อมส่ง/พรีออเดอร์ (แก้ข้อความตรงนี้)","ไม่รับเปลี่ยน/คืนสินค้า ยกเว้นสินค้าชำรุด","กรุณาถ่ายวิดีโอตอนแกะพัสดุ"],tag:"ul"},
  how:{title:"วิธีสั่งซื้อ",items:["เลือกสินค้าแล้วกด “เพิ่ม”","กด “ตะกร้า” แล้วส่งรายการให้ร้านทาง DM","โอนเงินตามยอด แล้วส่งสลิป","รอรับของ"],tag:"ol"},
  promo:{title:"โปรโมชั่น",items:["ใส่โปรโมชั่นของร้านตรงนี้"],tag:"ul"}
};
const cart=[];
const v=document.getElementById('view');
const btn=(t,f,c='big')=>`<button class="${c}" onclick="${f}">${t}</button>`;
const back=f=>`<button class="back" onclick="${f}">‹ กลับ</button>`;

function go(page,arg){
  if(page==='home'){
    v.innerHTML=`<div class="menu">${btn('อ่านก่อนสั่งซื้อ',"go('read')")}${btn('วิธีสั่งซื้อ',"go('how')")}${btn('โปรโมชั่น',"go('promo')")}${btn('Shop here',"go('shop')",'big main')}</div>`;
  }else if(info[page]){
    const i=info[page];
    v.innerHTML=`${back("go('home')")}<h2>${i.title}</h2><div class="box"><${i.tag}>${i.items.map(x=>`<li>${x}</li>`).join('')}</${i.tag}></div>`;
  }else if(page==='shop'){
    v.innerHTML=`${back("go('home')")}<h2>เลือกหมวดหมู่</h2><div class="menu">${btn('ทั้งหมด',"go('cat','All')")}${cats.map(c=>btn(c,`go('cat','${c}')`)).join('')}</div>`;
  }else if(page==='cat'){
    const list=products.filter(p=>arg==='All'||(arg==='New Arrivals'?p.isNew:p.cat===arg));
    v.innerHTML=`${back("go('shop')")}<h2>${arg==='All'?'ทั้งหมด':arg}</h2><div class="grid">${list.map(p=>`<div class="card"><div class="ph">รูปสินค้า</div><b>${p.name}</b><div class="price">฿${p.price}</div><button class="add" onclick="add('${p.name}')">เพิ่ม</button></div>`).join('')||'<p>ยังไม่มีสินค้าในหมวดนี้</p>'}</div>`;
  }
  scrollTo(0,0);
}
function add(n){cart.push(n);document.getElementById('cart').textContent=`ตะกร้า (${cart.length} ชิ้น)`}
function showCart(){
  if(!cart.length){alert('ตะกร้ายังว่างอยู่');return}
  const total=cart.reduce((s,n)=>s+products.find(p=>p.name===n).price,0);
  alert(cart.join('\n')+`\n\nรวม ฿${total}`);
}
go('home');
</script>
</body>
</html>
