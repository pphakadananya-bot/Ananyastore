<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANANYA'S STORE</title>
<style>
:root{--pink:#c9668c;--pink-soft:#f9e4ec;--pink-btn:#e8a6bf;--blue:#bcd6f0;--blue-text:#4a6a9c;--bg:#fff7f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#555;font-family:-apple-system,"Sukhumvit Set","Noto Sans Thai",Arial,sans-serif}
button{font-family:inherit}
header{background:var(--pink-soft);border-bottom:6px solid var(--blue);text-align:center;padding:32px 16px;cursor:pointer}
header h1{margin:0;color:var(--pink);font-size:2rem}
main{max-width:560px;margin:0 auto;padding:24px 16px 110px}
.logo{position:relative;width:110px;height:110px;margin:0 auto 18px;border-radius:50%;background:var(--pink-soft);border:3px solid #fff;box-shadow:0 2px 10px #0002;display:flex;align-items:center;justify-content:center;color:var(--pink);font-size:2.4rem;font-weight:700;overflow:hidden}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.contacts{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.contacts a{display:block;text-align:center;text-decoration:none;background:#fff;color:var(--pink);border:2px solid var(--pink-soft);border-radius:999px;padding:12px;font-weight:600}
.menu{display:flex;flex-direction:column;gap:14px}
.big{border:0;border-radius:18px;padding:20px;font-size:1.1rem;background:var(--blue);color:var(--blue-text);cursor:pointer}
.big.main{background:var(--pink);color:#fff;font-weight:700}
.back{background:none;border:0;color:var(--pink);font-size:1rem;cursor:pointer;margin-bottom:12px;padding:0}
h2{color:var(--pink);margin:0 0 14px}
.box{background:#fff;border:2px solid var(--pink-soft);border-radius:18px;padding:18px;line-height:1.7}
.box ol,.box ul{margin:0;padding-left:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:2px solid var(--pink-soft);border-radius:18px;padding:12px;text-align:center}
.ph{background:var(--pink-soft);color:var(--pink);border-radius:12px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.card b{display:block;font-size:.9rem}
.price{color:var(--pink);font-weight:700;margin:4px 0 8px}
.row{display:flex;gap:6px;justify-content:center}
.add,.del{border:0;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.add{background:var(--pink-btn);color:#fff}
.del{background:#eee;color:#888}
.qty{font-size:.8rem;color:#999;margin-top:6px;min-height:1.2em}
.sold{color:#aaa;display:inline-block;padding:7px 0}
#cart{position:fixed;right:16px;bottom:16px;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-size:1rem;box-shadow:0 4px 14px #0003;cursor:pointer}
#modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:flex-end;justify-content:center}
#modal .sheet{background:#fff;width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--pink-soft)}
.total{font-weight:700;color:var(--pink);font-size:1.15rem;display:flex;justify-content:space-between;margin-top:12px}
.note{font-size:.85rem;color:#888;margin:12px 0}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue-text);outline-offset:2px}
</style>
</head>
<body>
<header onclick="go('home')"><h1>ANANYA'S STORE</h1></header>
<main><div id="view"></div></main>
<button id="cart" onclick="showCart()">ตะกร้า (0 ชิ้น)</button>
<div id="modal" onclick="if(event.target===this)closeCart()"><div class="sheet" id="sheet"></div></div>

<script src="products.js"></script>
<script>
// ===== ใส่ลิงก์ช่องทางติดต่อตรงนี้ (วางลิงก์ระหว่าง "") =====
const LINKS={
  LINE:"",       // เช่น https://line.me/ti/p/xxxx
  Instagram:"",  // เช่น https://instagram.com/ชื่อไอจี
  WhatsApp:"",   // เช่น https://wa.me/66812345678
  TikTok:""      // เช่น https://tiktok.com/@ชื่อติ๊กตอก
};
// โลโก้: อัปโหลดรูปชื่อ logo.png ไว้ใน repo เดียวกัน จะขึ้นอัตโนมัติ

// ===== ข้อความหน้าข้อมูล (แก้ได้) =====
const info={
  read:{title:"อ่านก่อนสั่งซื้อ",tag:"ul",items:["ใส่ข้อความอ่านก่อนสั่งซื้อตรงนี้","ไม่รับเปลี่ยน/คืนสินค้า ยกเว้นสินค้าชำรุด","กรุณาถ่ายวิดีโอตอนแกะพัสดุ"]},
  how:{title:"วิธีสั่งซื้อ",tag:"ol",items:["เลือกหมวดและกด “เพิ่ม” ที่สินค้าที่ต้องการ","กดตะกร้ามุมขวาล่าง ตรวจรายการให้ถูกต้อง","แคปหน้าจอตะกร้าส่งให้ร้านทาง DM","ร้านจะแจ้งค่าส่งและเตรียมของให้"]},
  promo:{title:"โปรโมชั่น",tag:"ul",items:["ใส่โปรโมชั่นของร้านตรงนี้"]}
};

const cart={};
const v=document.getElementById('view');
const btn=(t,f,c='big')=>`<button class="${c}" onclick="${f}">${t}</button>`;
const back=f=>`<button class="back" onclick="${f}">‹ ย้อนกลับ</button>`;

function go(page,arg){
  if(page==='home'){
    v.innerHTML=`<div class="logo"><span>A</span><img src="logo.png" alt="logo" onerror="this.remove()"></div>
    <div class="contacts">${Object.entries(LINKS).map(([n,u])=>`<a href="${u||'#'}" target="_blank" rel="noopener">${n}</a>`).join('')}</div>
    <div class="menu">${btn('อ่านก่อนสั่งซื้อ',"go('read')")}${btn('วิธีสั่งซื้อ',"go('how')")}${btn('โปรโมชั่น',"go('promo')")}${btn('Shop here',"go('shop')",'big main')}</div>`;
  }else if(info[page]){
    const i=info[page];
    v.innerHTML=`${back("go('home')")}<h2>${i.title}</h2><div class="box"><${i.tag}>${i.items.map(x=>`<li>${x}</li>`).join('')}</${i.tag}></div>`;
  }else if(page==='shop'){
    v.innerHTML=`${back("go('home')")}<h2>เลือกหมวดหมู่</h2><div class="menu">${cats.map((c,i)=>btn(c,`go('cat',${i})`)).join('')}</div>`;
  }else if(page==='cat'){
    const c=cats[arg];
    const list=products.map((p,i)=>({p,i})).filter(x=>x.p.cat===c);
    v.innerHTML=`${back("go('shop')")}<h2>${c}</h2><div class="grid">${list.map(({p,i})=>`<div class="card"><div class="ph">${p.img?`<img src="${p.img}" alt="${p.name}">`:'รูปสินค้า'}</div><b>${p.name}</b><div class="price">฿${p.price}</div>${p.soldOut?'<span class="sold">หมดแล้ว</span>':`<div class="row"><button class="add" onclick="chg(${i},1)">เพิ่ม</button><button class="del" onclick="chg(${i},-1)">ยกเลิก</button></div><div class="qty" id="q${i}">${cart[i]?'ในตะกร้า '+cart[i]+' ชิ้น':''}</div>`}</div>`).join('')||'<p>ยังไม่มีสินค้าในหมวดนี้</p>'}</div>`;
  }
  scrollTo(0,0);
}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function chg(i,d){
  const n=(cart[i]||0)+d;
  if(n<=0)delete cart[i];else cart[i]=n;
  const q=document.getElementById('q'+i);if(q)q.textContent=cart[i]?'ในตะกร้า '+cart[i]+' ชิ้น':'';
  document.getElementById('cart').textContent=`ตะกร้า (${count()} ชิ้น)`;
}
function showCart(){
  const ids=Object.keys(cart);
  let html='<h2>ตะกร้าของฉัน</h2>';
  if(!ids.length)html+='<p>ตะกร้ายังว่างอยู่</p>';
  else{
    let total=0;
    html+=ids.map(i=>{const p=products[i],q=cart[i];total+=p.price*q;return `<div class="line"><span>${p.name} × ${q}</span><span>฿${p.price*q}</span></div>`}).join('');
    html+=`<div class="total"><span>รวม</span><span>฿${total}</span></div>
    <p class="note">* ยอดนี้เป็นค่าสินค้าอย่างเดียว ยังไม่รวมค่าส่ง<br>แคปหน้าจอนี้ส่งให้ร้านทาง DM ได้เลย</p>`;
  }
  html+=`<button class="big" style="width:100%;padding:14px" onclick="closeCart()">ปิด</button>`;
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('modal').style.display='flex';
}
function closeCart(){document.getElementById('modal').style.display='none'}
go('home');
</script>
</body>
</html>
